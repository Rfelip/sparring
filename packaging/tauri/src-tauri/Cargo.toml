# NOTE: the *package* name is "sparring-app", not "sparring". Tauri's build
# script reserves the bare crate name "sparring" (alongside app/tauri/core/…)
# and panics on it. The produced *binary* and bundle are still named "sparring"
# via [[bin]] below + productName in tauri.conf.json — only the crate id differs.
[package]
name = "sparring-app"
version = "0.1.0"
description = "Active-recall flashcards with FSRS scheduling and KaTeX math"
authors = ["Ruan Felipe"]
edition = "2021"
rust-version = "1.77.2"

# The single binary the bundle ships. `default-run` lets `cargo run` pick it.
[[bin]]
name = "sparring"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binary for distribution.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
